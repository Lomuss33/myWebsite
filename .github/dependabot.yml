version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      development-tool-patches:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "@eslint/*"
          - "@playwright/test"
          - "@types/*"
          - "@vitejs/*"
          - "eslint*"
          - "globals"
          - "sass-embedded"
          - "sharp"
          - "vite"
        update-types:
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
