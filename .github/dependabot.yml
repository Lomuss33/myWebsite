version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    # React's ESLint plugin does not support ESLint 10 yet. Upgrade together
    # after the React plugins declare support for the next ESLint major.
    ignore:
      - dependency-name: eslint
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@eslint/js"
        update-types:
          - "version-update:semver-major"
    groups:
      development-tool-patches:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "@eslint/*"
          - "@playwright/test"
          - "@types/*"
          - "@vitejs/*"
          - "eslint*"
          - "globals"
          - "sass-embedded"
          - "sharp"
          - "vite"
        update-types:
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
