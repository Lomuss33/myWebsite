<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clean Software stickers</title><style>*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,sans-serif;background:#10192b;color:#d7e2f1}main{max-width:1280px;margin:auto;padding:32px 20px}h1{font-size:clamp(28px,4vw,42px);letter-spacing:-.035em;line-height:1.12}p,small{color:#aabbd2}a{color:#91c5e0}figure{margin:24px 0;border:1px solid #34465e;border-radius:10px;overflow:hidden}figcaption{padding:16px 20px;font-weight:700}figcaption small{display:block;font-weight:400}.comparison{display:grid;grid-template-columns:1fr 1fr}.stage{padding:16px;min-width:0}.light{background:linear-gradient(135deg,#ffffff,#f6e2e9);color:#26344d}.dark{background:linear-gradient(135deg,#101c33,#52221f);color:#d7e2f1}.stage b{text-transform:uppercase;font-size:11px;letter-spacing:.1em}.sizes{display:flex;align-items:center;justify-content:space-evenly;gap:10px;padding:12px 0}.sizes>div{text-align:center}.sizes img{display:block;margin:auto;max-width:100%;object-fit:contain}.sizes small{display:block;color:inherit;opacity:.7;font-size:11px;margin-top:12px}@media(max-width:1050px){.comparison{grid-template-columns:1fr}}@media(max-width:540px){.sizes{justify-content:flex-start;overflow-x:auto}.sizes>div{flex-shrink:0}main{padding:20px 10px}}.dark .sizes img{filter:brightness(1.12) saturate(1.06) contrast(1.02) drop-shadow(0 2px 2px rgba(9, 18, 34, .32))}.light .sizes img{filter:brightness(.97) saturate(1.08) contrast(1.08) drop-shadow(0 2px 2px rgba(15, 23, 42, .20))}</style></head><body><main><h1>One idea. Clear at every size.</h1><p>14 custom vector stickers, with the application's light and dark contrast filters at 40px, 104px and 256px. Native vector masters stay crisp when enlarged.</p><p><a href="clean-v4/manifest.json">Individual design briefs</a> · <a href="index-story-v3.html">Previous illustrations</a></p><figure><figcaption>Language conversation<small>One speech bubble with a bold German A-umlaut. Language, immediately recognisable.</small></figcaption><div class="comparison"><div class="stage light"><b>light</b><div class="sizes"><div><img src="clean-v4/01-language.svg" width="40" height="40" alt="Language conversation"><small>40px</small></div><div><img src="clean-v4/01-language.svg" width="104" height="104" alt="Language conversation"><small>104px</small></div><div><img src="clean-v4/01-language.svg" width="256" height="256" alt="Language conversation"><small>256px</small></div></div></div><div class="stage dark"><b>dark</b><div class="sizes"><div><img src="clean-v4/01-language.svg" width="40" height="40" alt="Language conversation"><small>40px</small></div><div><img src="clean-v4/01-language.svg" width="104" height="104" alt="Language conversation"><small>104px</small></div><div><img src="clean-v4/01-language.svg" width="256" height="256" alt="Language conversation"><small>256px</small></div></div></div></div></figure>
